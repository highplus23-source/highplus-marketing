        * {

            box-sizing: border-box;

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        .error-code {
            font-size: clamp(80px, 20vw, 160px);
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #2563eb);

            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 700;
            margin-bottom: 12px;
            color: #1e293b;
        }

            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 480px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        a.btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        a.btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
        }

        a.btn-primary:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        a.btn-outline {
            border: 2px solid #3b82f6;
            color: #2563eb;
            background: transparent;
        }

        a.btn-outline:hover {
            background: #eff6ff;
            transform: translateY(-1px);
        }
