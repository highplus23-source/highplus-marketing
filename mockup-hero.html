<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[STEP 3 시안] Hero Mockup — HighPlus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #f0ecdc;
      overflow-x: hidden;
    }

    /* ───────────── NAV ───────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      height: 68px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }
    .nav-logo {
      font-size: 1.3rem;
      font-weight: 900;
      color: #7c5bf5;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }
    .nav-links a {
      color: #1a1a2e;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .nav-links a:hover { color: #7c5bf5; }
    .nav-cta {
      background: #7c5bf5 !important;
      color: #fff !important;
      padding: 0.5rem 1.3rem;
      border-radius: 100px;
      font-weight: 700 !important;
    }

    /* ───────────── HERO ───────────── */
    #hero {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 5% 100px;

      /* 3색 파스텔 그라데이션 — 3.png 기준 */
      background:
        radial-gradient(ellipse 70% 80% at 10% 20%, #c8dcf5 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 85% 15%, #d4c4f0 0%, transparent 50%),
        radial-gradient(ellipse 80% 70% at 50% 90%, #f0ecdc 0%, transparent 60%),
        linear-gradient(150deg, #cdddf7 0%, #daccf2 40%, #f2eedf 100%);
    }

    /* ───── 데코 점(dot) ───── */
    .dot {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    /* 위쪽 영역 */
    .d1  { width:13px; height:13px; background:#7c5bf5; top:16%; left:11%;   opacity:.85; animation: floatDot 5s ease-in-out infinite; }
    .d2  { width: 8px; height: 8px;  background:#3b82f6; top:26%; left:20%;   opacity:.75; animation: floatDot 6s ease-in-out infinite 1s; }
    .d3  { width:11px; height:11px; background:#facc15; top:13%; left:38%;   opacity:.9;  animation: floatDot 4.5s ease-in-out infinite 0.5s; }
    .d4  { width: 7px; height: 7px;  background:#22c55e; top:20%; right:30%;  opacity:.8;  animation: floatDot 5.5s ease-in-out infinite 2s; }
    .d5  { width:14px; height:14px; background:#14b8a6; top:11%; right:17%;  opacity:.7;  animation: floatDot 7s ease-in-out infinite 0.8s; }
    .d6  { width: 9px; height: 9px;  background:#7c5bf5; top:35%; right:12%;  opacity:.65; animation: floatDot 6s ease-in-out infinite 1.5s; }
    /* 아래쪽 영역 */
    .d7  { width:10px; height:10px; background:#facc15; bottom:28%; left:16%;  opacity:.8;  animation: floatDot 5s ease-in-out infinite 3s; }
    .d8  { width: 7px; height: 7px;  background:#3b82f6; bottom:22%; left:28%;  opacity:.7;  animation: floatDot 6.5s ease-in-out infinite 0.3s; }
    .d9  { width:12px; height:12px; background:#22c55e; bottom:30%; right:24%; opacity:.75; animation: floatDot 4.8s ease-in-out infinite 2.5s; }
    .d10 { width: 8px; height: 8px;  background:#7c5bf5; bottom:18%; right:36%; opacity:.65; animation: floatDot 5.8s ease-in-out infinite 1.2s; }
    .d11 { width:11px; height:11px; background:#14b8a6; top:50%; left: 6%;    opacity:.6;  animation: floatDot 7s ease-in-out infinite 0.7s; }
    .d12 { width: 6px; height: 6px;  background:#facc15; top:60%; right: 8%;   opacity:.7;  animation: floatDot 5.2s ease-in-out infinite 1.8s; }

    @keyframes floatDot {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    /* ───── 다이아몬드 스파클 ───── */
    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      opacity: .55;
      animation: floatDot 6s ease-in-out infinite;
    }
    .sparkle::before {
      content: '';
      display: block;
      width: 100%;
      height: 100%;
      background: currentColor;
      transform: rotate(45deg);
    }
    .sp1 { width:10px; height:10px; color:#7c5bf5; top:32%; right:13%; animation-delay: 1s; }
    .sp2 { width: 8px; height: 8px;  color:#3b82f6; bottom:32%; left: 9%; animation-delay: 3s; }
    .sp3 { width: 7px; height: 7px;  color:#facc15; top:62%; left:44%; animation-delay: 2s; }

    /* ───────────── CENTER CONTENT ───────────── */
    .hero-center {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 700px;
      width: 100%;
    }

    /* 섹션 태그 pill */
    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(124, 91, 245, 0.1);
      border: 1.5px solid rgba(124, 91, 245, 0.28);
      color: #7c5bf5;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.38rem 1rem;
      border-radius: 100px;
      margin-bottom: 1.8rem;
      backdrop-filter: blur(4px);
    }
    .hero-tag-dot {
      width: 6px; height: 6px;
      background: #7c5bf5;
      border-radius: 50%;
    }

    /* H1 */
    .hero-title {
      font-size: clamp(2.8rem, 6.5vw, 4.8rem);
      font-weight: 900;
      color: #1a1a2e;
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 1.6rem;
      word-break: keep-all;
    }
    .hero-title .accent {
      color: #7c5bf5;
    }

    /* 인라인 배지 3개 */
    .hero-badges {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1.6rem;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(124, 91, 245, 0.2);
      border-radius: 100px;
      padding: 0.38rem 0.95rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #1a1a2e;
      backdrop-filter: blur(6px);
    }
    .badge-pill .ico { color: #7c5bf5; font-size: 0.78rem; }

    /* 서브 카피 */
    .hero-sub {
      font-size: clamp(0.95rem, 2vw, 1.08rem);
      color: #4a4a6a;
      line-height: 1.85;
      margin-bottom: 2.6rem;
      word-break: keep-all;
    }

    /* CTA 버튼 2개 */
    .hero-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      padding: 15px 34px;
      background: #7c5bf5;
      color: #fff;
      border-radius: 100px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 32px rgba(124, 91, 245, 0.38);
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-2px); }

    .btn-secondary {
      padding: 15px 34px;
      background: transparent;
      color: #1a1a2e;
      border: 2px solid rgba(26, 26, 46, 0.5);
      border-radius: 100px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    .btn-secondary:hover {
      background: #1a1a2e;
      color: #fff;
      border-color: #1a1a2e;
      transform: translateY(-2px);
    }

    /* ───────────── 좌하단 플로팅 카드 ───────────── */
    .float-card {
      position: absolute;
      bottom: 14%;
      left: 4%;
      z-index: 3;
      background: #ece4ff;
      border-radius: 56px;
      padding: 1.6rem 2rem;
      min-width: 190px;
      box-shadow: 0 12px 40px rgba(124, 91, 245, 0.2);
      animation: floatCard 4s ease-in-out infinite;
    }
    .float-card-icon {
      font-size: 1.6rem;
      margin-bottom: 0.7rem;
    }
    .float-card-stat {
      font-size: 2.4rem;
      font-weight: 900;
      color: #7c5bf5;
      line-height: 1;
      margin-bottom: 0.3rem;
      letter-spacing: -1px;
    }
    .float-card-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #4a4a6a;
      line-height: 1.5;
    }
    .float-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.7rem;
      background: rgba(124, 91, 245, 0.12);
      border-radius: 100px;
      padding: 0.25rem 0.65rem;
      font-size: 0.68rem;
      font-weight: 700;
      color: #7c5bf5;
    }
    .float-card-badge::before {
      content: '';
      width: 5px; height: 5px;
      background: #7c5bf5;
      border-radius: 50%;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    /* ───────────── 우측 원형 배지 ───────────── */
    .float-badge {
      position: absolute;
      top: 50%;
      right: 4%;
      transform: translateY(-50%);
      z-index: 3;
      animation: floatBadge 5.5s ease-in-out infinite;
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(-50%); }
      50%       { transform: translateY(calc(-50% - 14px)); }
    }

    .badge-outer {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background: #1a1a2e;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(26, 26, 46, 0.25);
    }
    .badge-center {
      font-size: 2.2rem;
      z-index: 1;
      position: relative;
    }
    .badge-svg {
      position: absolute;
      top: 0; left: 0;
      width: 136px;
      height: 136px;
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav role="navigation">
  <a href="#" class="nav-logo">HighPlus</a>
  <ul class="nav-links">
    <li><a href="#">우리의 차별점</a></li>
    <li><a href="#">핵심 서비스</a></li>
    <li><a href="#" class="nav-cta">바로 연결하기</a></li>
  </ul>
</nav>

<!-- HERO -->
<section id="hero">

  <!-- 데코 점들 -->
  <div class="dot d1"></div>
  <div class="dot d2"></div>
  <div class="dot d3"></div>
  <div class="dot d4"></div>
  <div class="dot d5"></div>
  <div class="dot d6"></div>
  <div class="dot d7"></div>
  <div class="dot d8"></div>
  <div class="dot d9"></div>
  <div class="dot d10"></div>
  <div class="dot d11"></div>
  <div class="dot d12"></div>

  <!-- 다이아몬드 스파클 -->
  <div class="sparkle sp1"></div>
  <div class="sparkle sp2"></div>
  <div class="sparkle sp3"></div>

  <!-- ① 좌하단 플로팅 카드 -->
  <div class="float-card" aria-hidden="true">
    <div class="float-card-icon">🏥</div>
    <div class="float-card-stat">94%</div>
    <div class="float-card-label">파트너 병원<br>계약 연장률</div>
    <div class="float-card-badge">실제 성과 기준</div>
  </div>

  <!-- ② 중앙 콘텐츠 -->
  <div class="hero-center">

    <div class="hero-tag">
      <span class="hero-tag-dot"></span>
      BLOG AUTOMATION · AI
    </div>

    <h1 class="hero-title">
      병원을 직접 운영해본<br>
      사람이 만든<br>
      <span class="accent">실행 중심</span> 마케팅
    </h1>

    <div class="hero-badges">
      <span class="badge-pill"><span class="ico">✦</span> Ai 실장 자동화</span>
      <span class="badge-pill"><span class="ico">✦</span> 브랜딩 블로그</span>
      <span class="badge-pill"><span class="ico">✦</span> 네이버 플레이스</span>
    </div>

    <p class="hero-sub">
      초진이 늘지 않는 것은,<br />
      키워드 전략부터 콘텐츠, 플레이스, 퍼널 설계까지<br />
      구조가 빠져있기 때문입니다.
    </p>

    <div class="hero-btns">
      <a href="#" class="btn-primary">블로그 자동화 프로그램 (Ai 실장)</a>
      <a href="#" class="btn-secondary">블로그 대행 알아보기</a>
    </div>

  </div>

  <!-- ③ 우측 원형 배지 -->
  <div class="float-badge" aria-hidden="true">
    <div class="badge-outer">
      <!-- 원형 텍스트 SVG -->
      <svg class="badge-svg" viewBox="0 0 136 136">
        <defs>
          <path id="cp"
            d="M 68,68 m -50,0 a 50,50 0 1,1 100,0 a 50,50 0 1,1 -100,0"/>
        </defs>
        <text font-size="9" font-weight="700" fill="#ffffff"
              font-family="Noto Sans KR, sans-serif" letter-spacing="3">
          <textPath href="#cp">
            HighPlus · 병원마케팅 · 전문파트너 · &nbsp;
          </textPath>
        </text>
      </svg>
      <!-- 중앙 아이콘 -->
      <span class="badge-center">⚡</span>
    </div>
  </div>

</section>

</body>
</html>
